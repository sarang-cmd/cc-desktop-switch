name: Capture README screenshots

on:
  pull_request:
    paths:
      - "README.md"
      - "frontend/**"
      - "scripts/capture_readme_screenshots.py"
      - ".github/workflows/capture-readme-screenshots.yml"

permissions:
  contents: read

jobs:
  capture:
    name: Capture desktop and mobile app screens
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install app and screenshot dependencies
        run: python -m pip install 'fastapi>=0.110' 'uvicorn>=0.27' 'httpx[socks]>=0.27' playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Capture screenshots from the running app
        run: python scripts/capture_readme_screenshots.py
      - uses: actions/upload-artifact@v4
        with:
          name: readme-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 7
